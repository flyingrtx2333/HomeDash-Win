{{define "pages/terminal-content"}}

<!-- xterm.js 核心 CSS（必须先加载） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<link rel="stylesheet" href="/static/css/terminal.css" />

<style>
  .terminal-container {
    position: relative;
    width: 100%;
    height: 70vh;
    /* 或 600px，根据你的布局调整 */
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
  }

  .terminal-status {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
  }

  .status-dot.connected {
    background: #0dbc79;
  }

  .status-dot.error {
    background: #cd3131;
  }
</style>

<div class="section-header">
  <h2>SSH 终端</h2>
  <div class="header-actions">
    <span class="terminal-status" id="terminalStatus">
      <span class="status-dot"></span>
      <span>未连接</span>
    </span>
    <button class="btn-outline" id="connectTerminalBtn">🔌 重连</button>
  </div>
</div>
<div class="terminal-header">
  <div class="terminal-dots">
    <span class="terminal-dot red"></span>
    <span class="terminal-dot yellow"></span>
    <span class="terminal-dot green"></span>
  </div>
  <div class="terminal-title">
    <span>PowerShell</span>
  </div>

</div>
<div class="terminal-wrapper" id="terminalContainer"></div>
<script src="/static/js/terminal.js" type="module"></script>

{{end}}
